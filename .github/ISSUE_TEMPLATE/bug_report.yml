name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can — TTS mode and reproduction steps matter a lot.

        See [CONTRIBUTING.md](https://github.com/iCTX0780/kheru/blob/main/CONTRIBUTING.md) for triage expectations.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Generate fails on the third paragraph with a 500 error from /api/generate.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to see the problem again.
      placeholder: |
        1. Start with `make dev-gentle`
        2. Create a project with 3 paragraphs
        3. Click Generate on paragraph 3
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: tts_mode
    attributes:
      label: TTS mode
      description: Which synthesis path were you using?
      options:
        - Hosted (default, VITE_CLIENT_TTS=0)
        - Hybrid (VITE_CLIENT_TTS=1 + Gentle)
        - Offline (VITE_CLIENT_TTS=1, no Gentle)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: `git rev-parse --short HEAD` or release tag, if known.
      placeholder: abc1234 or main @ 2026-07-11

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11

  - type: input
    id: browser
    attributes:
      label: Browser (if using client TTS or studio UI)
      placeholder: Chrome 138, Safari 18, Firefox 140

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, browser console, or Network tab details. Redact private script text if needed.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I can reproduce this on the latest `main` branch (or noted the version above)
          required: true
