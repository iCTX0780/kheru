name: Feature request
description: Suggest an improvement, new voice, dialect, or capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and your idea. For **new dialects, languages, or voices**, open an issue first and wait for maintainer feedback on approach.

  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      description: What rehearsal or workflow problem does this solve?
      placeholder: As a podcaster rehearsing UK dialogue, I need British English voices so character accents match the script.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work in the studio?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Studio UX
        - Voices / pronunciation
        - Locale or dialect (non-US English)
        - New language
        - TTS engine
        - Export / playback
        - Offline / client TTS
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: locale
    attributes:
      label: Locale / dialect (if applicable)
      options:
        - label: US English
        - label: UK English
        - label: Australian English
        - label: Other English dialect
        - label: Non-English language
        - label: Not locale-related

  - type: dropdown
    id: implement
    attributes:
      label: Are you willing to implement this?
      options:
        - Yes, I can open a PR
        - Maybe, with guidance
        - No, suggestion only
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or simpler approaches you thought about.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Sample script lines, mockups, links to voice models, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
        - label: For large features, I am open to discussing scope before coding
          required: true
