# Kheru studio — TTS runs in the browser; container only serves the app.

services:
  kheru:
    build:
      context: .
      dockerfile: Dockerfile
    image: kheru:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
