services:
  gentle:
    image: lowerquality/gentle
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8765/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  kheru:
    build:
      context: ../..
      dockerfile: apps/kheru/Dockerfile
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      VOICES_DIR: /voices
      DATA_DIR: /data
      TRANSFORMERS_CACHE: /data/transformers-cache
      GENTLE_URL: http://gentle:8765
      GENTLE_WAIT_SECS: 180
    volumes:
      - ../../voices:/voices:ro
      - ./data:/data
    depends_on:
      gentle:
        condition: service_healthy
    restart: unless-stopped
