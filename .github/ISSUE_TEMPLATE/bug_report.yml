name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can — browser, OS, and reproduction steps matter a lot.

        See [CONTRIBUTING.md](https://github.com/iCTX0780/kheru/blob/main/CONTRIBUTING.md) for triage expectations.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Generate all stalls after paragraph 8; browser console shows an OPFS error.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to see the problem again.
      placeholder: |
        1. Start with `pnpm dev`
        2. Create a project with 3 paragraphs
        3. Click Generate all
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: `git rev-parse --short HEAD` or release tag, if known.
      placeholder: abc1234 or main @ 2026-07-17

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 138, Safari 18, Firefox 140

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, browser console, or Network tab details. Redact private script text if needed.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: false
        - label: I can reproduce this on a clean project
          required: false
